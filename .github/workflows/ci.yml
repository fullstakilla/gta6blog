name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint + build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      # Прод-секреты в CI не нужны — все запросы к БД во время build
      # прикрыты force-dynamic. Prisma-клиент валидирует только формат URL.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      IRON_SESSION_SECRET: ci-only-dummy-secret-min-32-chars-long-1234567890xxxx
      IP_HASH_SALT: ci-dummy-salt
      NEXT_PUBLIC_SITE_URL: https://gta6blog.ru

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
